<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" width="760" height="180" fill="none">
  <!-- TM Badge -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="220" height="160" rx="36" fill="#0066c0" stroke="#0066c0" stroke-width="2"/>
    <rect x="12" y="12" width="196" height="136" rx="26" fill="none" stroke="#ffffff" stroke-width="3.5"/>
    
    <!-- T -->
    <path d="M 45 42 L 95 42 C 105 42 110 47 110 56 C 110 65 104 70 94 70 L 82 70 L 82 114 C 82 122 75 128 66 128 C 57 128 50 122 50 114 L 50 70 L 45 70 C 36 70 30 64 30 56 C 30 47 36 42 45 42 Z" fill="#67d2fe" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- M -->
    <g transform="translate(85, 42)">
      <!-- Left leg of M -->
      <path d="M 12 72 L 28 14 C 31 3 43 0 50 7 C 56 14 55 24 50 36 L 36 72 C 32 82 20 86 12 78 C 6 72 6 62 12 50 Z" fill="#67d2fe" stroke="#ffffff" stroke-width="3"/>
      <!-- Right leg of M -->
      <path d="M 46 72 L 62 14 C 65 3 77 0 84 7 C 90 14 89 24 84 36 L 70 72 C 66 82 54 86 46 78 C 40 72 40 62 46 50 Z" fill="#67d2fe" stroke="#ffffff" stroke-width="3"/>
    </g>
  </g>

  <!-- Pick n Pay Wordmark -->
  <g transform="translate(255, 30)">
    <!-- 'P' Navy Box -->
    <rect x="0" y="0" width="120" height="120" rx="20" fill="#132742"/>
    <text x="32" y="90" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="96" fill="#ffffff">P</text>
    
    <!-- 'ick n' -->
    <text x="135" y="90" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="88" fill="#132742" letter-spacing="-1">ick n</text>
    
    <!-- 'P' Red Box -->
    <g transform="translate(365, 0)">
      <rect x="0" y="0" width="120" height="120" rx="20" fill="#c41230"/>
      <text x="32" y="90" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="96" fill="#ffffff">P</text>
    </g>
    
    <!-- 'ay' -->
    <text x="498" y="90" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="88" fill="#c41230" letter-spacing="-1">ay</text>
  </g>
</svg>
